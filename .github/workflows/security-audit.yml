name: security-audit

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PROJECT_NAME: securityaudit

jobs:
  prepare:
    name: Prepare variables
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      ghcr_image: ${{ steps.vars.outputs.ghcr_image }}
    steps:
      - name: Compute image names
        id: vars
        shell: bash
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="${GITHUB_RUN_ID}"
          GHCR_IMAGE="ghcr.io/${OWNER_LC}/${PROJECT_NAME}:${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"

  lint:
    name: Docker lint
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hadolint
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            ghcr.io/hadolint/hadolint:latest \
            hadolint Dockerfile

  sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            semgrep/semgrep:latest \
            semgrep scan --config=auto --json --output /src/gl-sast-report.json /src

      - name: Show Semgrep report
        if: always()
        run: cat gl-sast-report.json

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: gl-sast-report.json

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs:
      - prepare
      - lint
      - sast
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t "${PROJECT_NAME}:${{ needs.prepare.outputs.image_tag }}" .

      - name: Save Docker image as tarball
        run: docker save "${PROJECT_NAME}:${{ needs.prepare.outputs.image_tag }}" -o "${PROJECT_NAME}.tar"

      - name: Upload built image
        uses: actions/upload-artifact@v4
        with:
          name: built-image
          path: "${{ env.PROJECT_NAME }}.tar"

  container_scanning:
    name: Trivy container scan
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    steps:
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: built-image
          path: .

      - name: Load Docker image
        run: docker load -i "${PROJECT_NAME}.tar"

      - name: Run Trivy and generate JSON report
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "${{ env.PROJECT_NAME }}:${{ needs.prepare.outputs.image_tag }}"
          format: json
          output: trivy-report.json
          exit-code: '0'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

      - name: Fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "${{ env.PROJECT_NAME }}:${{ needs.prepare.outputs.image_tag }}"
          severity: CRITICAL
          format: table
          exit-code: '1'

  push:
    name: Push image to GHCR
    runs-on: ubuntu-latest
    needs:
      - prepare
      - container_scanning
    if: github.event_name != 'pull_request'
    steps:
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: built-image
          path: .

      - name: Load Docker image
        run: docker load -i "${PROJECT_NAME}.tar"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image
        run: docker tag "${PROJECT_NAME}:${{ needs.prepare.outputs.image_tag }}" "${{ needs.prepare.outputs.ghcr_image }}"

      - name: Push image
        run: docker push "${{ needs.prepare.outputs.ghcr_image }}"
